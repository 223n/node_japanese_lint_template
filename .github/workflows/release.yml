name: 公開

# タグを切ると npm へ公開する。
#
# 認証は Trusted Publishing（OIDC）で行う。長く生きるトークンを秘密として
# 置かずに済み、来歴（provenance）も自動で付く。
#
# 使う前に npmjs.com 側で一度だけ設定が要る（README「npm へ公開する」）。
# 設定にはこのファイル名（release.yml）をそのまま登録する。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing に要る。これが無いと OIDC のトークンを作れない
  id-token: write

jobs:
  publish:
    name: npmへ公開する
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Nodeを用意
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: npmを上げる
        # Trusted Publishing は npm 11.5.1 以上で使える。
        # ランナーに入っている版が足りないことがあるため、明示的に上げる
        run: |
          npm install -g npm@latest
          npm --version

      - name: 依存を入れる
        run: npm ci

      - name: タグと版が一致することを確かめる
        # 版を上げ忘れたまま公開すると取り消せない。
        # publish は実質やり直しがきかないため、その前に止める
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "タグ: $tag / package.json: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::タグ($tag)と package.json の版($pkg)が食い違っています" >&2
            exit 1
          fi

      - name: 検査を通す
        # 壊れたものを公開しない。取り消せないためである
        run: npm run check

      - name: 配布物の中身を確かめる
        # files に書いたものだけが入っているか。
        # 見本と検証が混ざっていないかを目で見えるようにする
        run: npm pack --dry-run

      - name: 公開する
        # トークンは要らない。npm が OIDC を見つけて使う
        run: npm publish --access public
